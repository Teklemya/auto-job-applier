[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-job-applier"
version = "0.1.0"
description = "Personal pipeline that collects SWE roles and applies on Workday, Greenhouse and Lever."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "playwright>=1.45",
    "google-genai>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aja = "auto_job_applier.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_job_applier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
