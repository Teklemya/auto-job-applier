# auto-job-applier profile. Lives at ~/.auto-job-applier/profile.yaml. Never commit it.
# Every answer the tool gives on your behalf starts here. Validate with: aja check

contact:
  first_name: Jane
  last_name: Doe
  preferred_name: null
  email: jane.doe@example.com
  phone: "555-555-0100"
  phone_device_type: Mobile

address:
  line1: 123 Main St
  line2: ""
  city: Kansas City
  state: MO
  postal_code: "64105"
  country: United States

links:
  linkedin: https://www.linkedin.com/in/janedoe
  github: https://github.com/janedoe
  portfolio: null

work_authorization:
  authorized_to_work_us: true
  requires_sponsorship_now: false
  requires_sponsorship_future: false
  visa_status: F-1 OPT
  # Option sentences you approve, word for word, for questions that aren't Yes/No.
  # `aja review` prints the line to add after you answer one.
  approved_answers: []
  #   - "I am authorized to work for any employer in the country in which this position is based."
  # Your own words for open-ended text questions ("what sponsorship would you require?",
  # "describe your work authorization"). Never typed into dropdowns or citizenship questions.
  explanation: null

education:
  - school: Example University
    degree: Bachelor of Science
    major: Computer Science
    # Tried in order when a dropdown doesn't offer the value above. Leave a list empty to
    # stage a draft instead.
    degree_also: ["Bachelor's Degree", "Bachelor"]
    major_also: []
    start: "2020-08"
    graduation: "2024-05"
    gpa: null

experience:
  current_company: Example Corp
  current_title: Software Engineer
  years_experience: 1

# Voluntary self-identification. Each value is answered verbatim when a form asks.
demographics:
  gender: Decline to self-identify
  race_ethnicity: Decline to self-identify
  hispanic_latino: Decline to self-identify
  veteran_status: Decline to self-identify
  disability_status: Decline to self-identify
  pronouns: null  # e.g. He/Him

preferences:
  start_date: Two weeks after offer
  heard_about_us: Job board
  salary_floor: 120000
  willing_to_relocate: true

# Screening locations. Remote always passes. Omit a list to keep the built-in defaults
# (see `Targeting` in profile.py); set it to replace them.
targeting: {}
  # kc_metro: ["Kansas City, MO", "Overland Park, KS", "Olathe, KS", ...]
  # hubs: ["SF", "Seattle, WA", "NYC", "Boston, MA", "Austin, TX", ...]  # any company there

settings:
  # Shadow mode: false = draft everything, submit nothing. Only you change this.
  submit: false
  daily_submit_cap: 3
  # Fit verdicts that skip a job: strong | ok | stretch | mismatch. Add stretch to be pickier.
  fit_skip: [mismatch]

# Gemini free tier (needs GEMINI_API_KEY from aistudio.google.com). Quotas are per model;
# check yours at https://ai.dev/rate-limit. Omit this section to keep the defaults:
# llm:
#   fit:     {model: gemini-3.5-flash-lite, min_interval_seconds: 4.5, daily_call_budget: 450}
#   answers: {model: gemini-3.8-flash, min_interval_seconds: 12.5, daily_call_budget: 18}
#   fit_batch_size: 8

resume_path: resume.pdf  # relative paths live next to this file
